[project]
name = "whistapp"
version = "1.0.0"
description = "Backend-driven whist tracker"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1,<4", "python-multipart>=0.0.9,<1", "openpyxl>=3.1,<4", "argon2-cffi>=23,<26", "itsdangerous>=2.2,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702", "E402"]

[project.scripts]
whistapp = "whistapp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whistapp"]

[tool.hatch.build.targets.wheel.force-include]
"src/whistapp/prompts/transcribe-score-sheet.md" = "whistapp/prompts/transcribe-score-sheet.md"
